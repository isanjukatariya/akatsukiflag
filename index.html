<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanju Singh | Cinematic Akatsuki WebGL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@1,400;1,500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #030407; 
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .header-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2.5rem 3.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .logo-brand {
            font-weight: 600;
            letter-spacing: 0.15em;
            color: #ffffff;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 3rem;
            opacity: 0.6;
            transition: opacity 0.3s ease, text-shadow 0.3s ease;
        }

        .nav-links a:hover {
            opacity: 1;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .hero-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
            pointer-events: none; 
            width: 100%;
            max-width: 600px;
        }

        .hero-text-overlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 500;
            font-style: italic;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
            color: #ffffff;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .hero-text-overlay p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #a0a0a5;
            font-weight: 300;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }
    </style>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <header class="header-nav">
        <div class="logo-brand">AKATSUKI</div>
        <nav class="nav-links">
            
        </nav>
    </header>

    <div id="webgl-container"></div>

    <div class="hero-text-overlay">
        <h1></h1>
        
    </div>

    <script>
        // basic scene setup
        const container = document.getElementById('webgl-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x030407, 1);
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030407, 0.0015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 450;

        // add bloom post-processing
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.2, 0.8, 0.1);
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // generate mask using canvas
        const canvasSize = 512;
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = canvasSize;
        maskCanvas.height = canvasSize;
        const ctx = maskCanvas.getContext('2d', { willReadFrequently: true });

        // svg path for the cloud
        const cloudSVGPath = "M358.3,254.7c-3.1-23.7-22.3-42-46-42c-2.3,0-4.5,0.2-6.7,0.5c-7.2-24.8-30.2-43.1-57.5-43.1c-14,0-26.8,4.8-37.1,12.8c-10-18.7-29.6-31.5-52.1-31.5c-29.5,0-54,21.8-57.9,50.1c-2.1-0.3-4.3-0.5-6.6-0.5c-27.6,0-50,22.4-50,50c0,16.2,7.7,30.5,19.6,39.6c-4.4,5.4-7.1,12.4-7.1,20c0,17.7,14.3,32,32,32c7.8,0,15-2.8,20.5-7.4c9.9,13.2,25.6,21.7,43.3,21.7c26.1,0,47.9-18.4,52.3-42.9c3.2,0.8,6.5,1.2,10,1.2c24.6,0,45.2-17.7,49.5-41.1c6,5.3,13.8,8.5,22.3,8.5c18.8,0,34-15.2,34-34C366.8,269.8,363.5,261.2,358.3,254.7z";
        const path2d = new Path2D(cloudSVGPath);

        // draw red background fill
        ctx.setTransform(1, 0, 0, 1, 0, 0); 
        ctx.clearRect(0, 0, canvasSize, canvasSize);
        ctx.translate(50, 10); 
        ctx.fillStyle = '#ff0000';
        ctx.fill(path2d);
        const bodyData = ctx.getImageData(0, 0, canvasSize, canvasSize).data;

        // draw white borders and inner accents
        ctx.setTransform(1, 0, 0, 1, 0, 0); 
        ctx.clearRect(0, 0, canvasSize, canvasSize); 
        
        ctx.translate(50, 10); 
        ctx.lineWidth = 6; 
        ctx.strokeStyle = '#ffffff';
        ctx.lineCap = 'round';
        ctx.stroke(path2d); 

        // inner line coordinates mapped to the svg space
        const innerLines = new Path2D();
        
        innerLines.moveTo(215, 185);
        innerLines.quadraticCurveTo(210, 230, 245, 235);
        
        innerLines.moveTo(100, 200);
        innerLines.quadraticCurveTo(130, 205, 135, 240);
        
        innerLines.moveTo(110, 330);
        innerLines.quadraticCurveTo(130, 300, 160, 295);
        
        innerLines.moveTo(310, 215);
        innerLines.quadraticCurveTo(290, 220, 295, 245);
        
        ctx.stroke(innerLines);
        const borderData = ctx.getImageData(0, 0, canvasSize, canvasSize).data;

        // extract particles from the canvas data
        const particles = [];
        const colors = [];
        const spacing = 3; 

        const colorWhite = new THREE.Color(0xffffff);
        const colorRed = new THREE.Color(0xcc0505);

        for (let y = 0; y < canvasSize; y += spacing) {
            for (let x = 0; x < canvasSize; x += spacing) {
                const index = (y * canvasSize + x) * 4;
                const isBorder = borderData[index + 3] > 128; 
                const isBody = bodyData[index + 3] > 128;

                if (isBorder || isBody) {
                    particles.push(x, -y, 0); 
                    if (isBorder) {
                        colors.push(colorWhite.r, colorWhite.g, colorWhite.b);
                    } else {
                        colors.push(colorRed.r, colorRed.g, colorRed.b);
                    }
                }
            }
        }

        // generate the 3d point cloud
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(particles, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        // center the geometry
        geometry.computeBoundingBox();
        geometry.center();

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uPixelRatio;
                attribute vec3 color;
                varying vec3 vColor;
                varying float vZ;

                void main() {
                    vColor = color;
                    vec3 pos = position;

                    // swirl math
                    float dist = length(pos.xy);
                    float angle = atan(pos.y, pos.x);
                    
                    float wave1 = sin(pos.x * 0.02 + uTime * 1.2) * 5.0;
                    float wave2 = cos(pos.y * 0.03 - uTime * 0.8) * 5.0;
                    float swirl = sin(angle * 2.0 + dist * 0.01 - uTime * 1.5) * 6.0;
                    
                    pos.z += wave1 + wave2 + swirl;
                    vZ = pos.z;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    
                    // size adjustment based on color
                    float pSize = (vColor.r > 0.9 && vColor.g > 0.9) ? 14.0 : 9.0;
                    gl_PointSize = (pSize * uPixelRatio) * (200.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vZ;

                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;

                    float alpha = smoothstep(0.5, 0.1, dist);
                    float depthShade = clamp((vZ + 15.0) / 30.0, 0.4, 1.1);
                    
                    vec3 finalColor = vColor;
                    if (vColor.r > 0.9 && vColor.g > 0.9) {
                        finalColor *= 1.6; 
                    } else {
                        finalColor *= depthShade; 
                    }

                    gl_FragColor = vec4(finalColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false, 
            blending: THREE.AdditiveBlending 
        });

        const pointCloud = new THREE.Points(geometry, material);
        
        // handle window resizing
        function updateScale() {
            let cloudScale = 1.3; 
            if (window.innerWidth < 768) cloudScale = 0.65; 
            else if (window.innerWidth < 1200) cloudScale = 1.0; 
            pointCloud.scale.set(cloudScale, cloudScale, cloudScale);
        }
        updateScale();
        scene.add(pointCloud);

        // background embers
        const embersGeo = new THREE.BufferGeometry();
        const embersCount = 150;
        const embersPos = new Float32Array(embersCount * 3);
        for(let i = 0; i < embersCount * 3; i+=3) {
            embersPos[i] = (Math.random() - 0.5) * 800;     
            embersPos[i+1] = (Math.random() - 0.5) * 600;   
            embersPos[i+2] = (Math.random() - 0.5) * 200;   
        }
        embersGeo.setAttribute('position', new THREE.BufferAttribute(embersPos, 3));
        const embersMat = new THREE.PointsMaterial({
            size: 2.5, color: 0xff3333, transparent: true, opacity: 0.6,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        const embers = new THREE.Points(embersGeo, embersMat);
        scene.add(embers);

        // render loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            material.uniforms.uTime.value = elapsedTime;

            // subtle wobble
            pointCloud.rotation.y = Math.sin(elapsedTime * 0.2) * 0.1;
            pointCloud.rotation.x = Math.cos(elapsedTime * 0.1) * 0.05;

            const positions = embers.geometry.attributes.position.array;
            for(let i = 1; i < embersCount * 3; i+=3) {
                positions[i] += 0.3; 
                positions[i-1] += Math.sin(elapsedTime + i) * 0.2; 
                if (positions[i] > 300) {
                    positions[i] = -300;
                    positions[i-1] = (Math.random() - 0.5) * 800;
                }
            }
            embers.geometry.attributes.position.needsUpdate = true;

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            updateScale();
        });

        animate();
    </script>
</body>
</html>
