<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Train Window (CSS & JS)</title>
    
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505; 
            font-family: 'JetBrains Mono', monospace;
        }

        .scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px; 
        }

        .landscape {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            will-change: transform; 
            transform-origin: center center;
            transform: scale(1.08); /* buffer for shaking */
        }

        .sky {
            position: absolute;
            inset: -10%; 
            background: linear-gradient(
                170deg, 
                #0b101c 0%, 
                #1e2a3f 30%, 
                #4a3f4e 55%, 
                #a85c53 75%, 
                #db9261 90%, 
                #fcd181 100%
            );
            z-index: 1;
        }

        .sun-flare {
            position: absolute;
            top: 25%;
            left: -10%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle at center, rgba(255, 230, 180, 0.8) 0%, rgba(250, 140, 70, 0.3) 25%, transparent 60%);
            border-radius: 50%;
            filter: blur(40px);
            mix-blend-mode: screen;
            z-index: 2;
        }

        .ambient-flare {
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle at center, rgba(160, 90, 80, 0.4) 0%, transparent 60%);
            filter: blur(60px);
            z-index: 2;
        }

        .clouds-container {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            filter: blur(40px);
            will-change: transform;
            animation: drift linear infinite;
        }

        /* cloud variations */
        .cloud-1 {
            top: 40%;
            width: 50vw;
            height: 15vh;
            background: rgba(80, 60, 70, 0.8);
            filter: blur(50px);
            animation-duration: 45s;
            animation-delay: -10s;
        }

        .cloud-2 {
            top: 55%;
            width: 60vw;
            height: 20vh;
            background: rgba(180, 100, 80, 0.5);
            filter: blur(35px);
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .cloud-3 {
            top: 20%;
            width: 40vw;
            height: 12vh;
            background: rgba(120, 110, 140, 0.4);
            filter: blur(45px);
            animation-duration: 38s;
            animation-delay: -20s;
        }

        .cloud-4 {
            top: 65%;
            width: 80vw;
            height: 25vh;
            background: rgba(255, 200, 150, 0.4);
            filter: blur(60px);
            animation-duration: 18s;
            animation-delay: 0s;
        }

        .cloud-5 {
            top: 75%;
            width: 120vw;
            height: 30vh;
            background: rgba(240, 170, 120, 0.6);
            filter: blur(50px);
            animation-duration: 22s;
            animation-delay: -12s;
        }

        @keyframes drift {
            0% { transform: translateX(120vw) scale(1); }
            100% { transform: translateX(-120vw) scale(1.2); }
        }

        .window-frame {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            border-radius: 8vmin;
            box-shadow: 
                0 0 0 100vmax #18181a, 
                inset 0 0 20px 5px rgba(0,0,0,0.9), 
                inset 10px 10px 40px 10px rgba(0,0,0,0.7), 
                inset 30px 0 80px -10px rgba(255, 140, 70, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 6vmin; 
        }

        /* film grain */
        .film-grain {
            position: absolute;
            inset: 0;
            z-index: 20; 
            pointer-events: none;
            opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .ui-overlay {
            position: absolute;
            left: calc(6vmin + 30px); 
            bottom: calc(6vmin + 25px);
            z-index: 30;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            line-height: 1.6;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .ui-highlight {
            color: rgba(255, 200, 120, 0.9);
            font-weight: 700;
        }

        /* cursor blink */
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        
        <div class="landscape" id="landscape">
            <div class="sky"></div>
            <div class="sun-flare"></div>
            <div class="ambient-flare"></div>
            
            <div class="clouds-container">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
                <div class="cloud cloud-4"></div>
                <div class="cloud cloud-5"></div>
            </div>
        </div>

        <div class="window-frame"></div>
        <div class="film-grain"></div>
        
        <div class="ui-overlay">
            INTERPLANETARY TRANSIT // <span class="ui-highlight">SEE YOU SPACE COWBOY...</span><br>
            SYS.TIME <span id="clock" class="ui-highlight">00:00:00</span> <span class="blink">_</span>
        </div>

    </div>

    <script>
        // clock logic
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock(); 

        // rumble animation
        const landscape = document.getElementById('landscape');
        
        function animateRumble(time) {
            // to seconds
            const t = time * 0.001; 

            // fake perlin noise using sine waves
            
            // swaying
            const swayX = Math.sin(t * 0.4) * 4 + Math.sin(t * 0.9) * 2;
            const swayY = Math.sin(t * 0.5) * 3 + Math.sin(t * 1.1) * 2;
            
            // bumps
            const bumpX = Math.sin(t * 3.2) * 1.5 + Math.sin(t * 4.7) * 1;
            const bumpY = Math.sin(t * 2.8) * 2.0 + Math.sin(t * 5.1) * 1.5;

            // micro vibrations
            const vibeX = Math.sin(t * 22) * 0.3;
            const vibeY = Math.sin(t * 28) * 0.6;

            // combine
            const x = swayX + bumpX + vibeX;
            const y = swayY + bumpY + vibeY;

            // apply to landscape, keep scale at 1.08
            landscape.style.transform = `scale(1.08) translate(${x}px, ${y}px)`;

            requestAnimationFrame(animateRumble);
        }

        // init
        requestAnimationFrame(animateRumble);
    </script>
</body>
</html>
